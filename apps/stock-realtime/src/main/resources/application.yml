server:
  port: 8081 # stock-api(8080)와 분리. FE 는 VITE_REALTIME_BASE_URL 로 이 주소를 가리킨다.
  shutdown: graceful
  tomcat:
    # SSE 장기 연결을 다수 유지하므로 keep-alive 를 넉넉히 둔다.
    keep-alive-timeout: 60s
    connection-timeout: 1m

spring:
  main:
    web-application-type: servlet
  application:
    name: stock-realtime
  profiles:
    active: local
  config:
    import:
      # 실행 위치(레포 루트 / 모듈 디렉토리)에 관계없이 env.properties 를 찾도록 둘 다 optional 로 둔다.
      - optional:file:./env.properties
      - optional:file:../../env.properties
      - jpa.yml
      - logging.yml

# LsWebSocketHandler 가 ls-investment.auth-token 을 사용한다(@Value).
ls-investment:
  app-key: ${LS_APP_KEY:1111}
  secret-key: ${LS_SECRET_KEY:1111}
  auth-token: ${LS_AUTH_TOKEN:1111}

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
