server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: stock-api
  profiles:
    active: local
  config:
    import:
      - optional:file:./env.properties
      - jpa.yml
      - logging.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # HS256 키는 최소 32바이트 이상이어야 한다. 운영 환경에서는 반드시 환경변수로 덮어쓸 것.
    secret: ${JWT_SECRET:local-dev-momentum-jwt-secret-key-please-change-0123456789}
    access-token-validity: 30m
    refresh-token-validity: 14d


---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false